name: "Module 4: Variables, Encrypted Secrets & GITHUB_TOKEN"
on: [push, workflow_dispatch]
jobs:
  secrets-and-token-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Access Configuration Variables and Secrets
        env:
          SECRET_TOKEN_VAL: ${{ secrets.MY_SECRET }}
        run: |
          echo "Configuration Variable: ${{ vars.APP_ENVIRONMENT }}"
          echo "Accessing Encrypted Secret: $SECRET_TOKEN_VAL"
      - name: Authenticate REST API Call with GITHUB_TOKEN
        run: |
          curl -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}