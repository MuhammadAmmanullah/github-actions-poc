name: Module 2A - Push and Pull Request

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  report-event:
    runs-on: ubuntu-latest
    steps:
      - name: Report trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Branch: $BRANCH_NAME"
