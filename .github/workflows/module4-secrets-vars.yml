name: Module 4 - Secrets and Variables

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Report configured variable
        env:
          DEMO_VARIABLE: ${{ vars.DEMO_VARIABLE }}
        run: |
          if [ -n "$DEMO_VARIABLE" ]; then
            echo "DEMO_VARIABLE is configured."
          else
            echo "DEMO_VARIABLE is not configured."
          fi

      - name: Report configured secret without exposing it
        env:
          DEMO_SECRET: ${{ secrets.DEMO_SECRET }}
        run: |
          if [ -n "$DEMO_SECRET" ]; then
            echo "DEMO_SECRET is configured."
          else
            echo "DEMO_SECRET is not configured."
          fi

      - name: Check GITHUB_TOKEN availability without exposing it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$GH_TOKEN" ]; then
            echo "GITHUB_TOKEN is available."
          else
            echo "GITHUB_TOKEN is not available."
            exit 1
          fi
